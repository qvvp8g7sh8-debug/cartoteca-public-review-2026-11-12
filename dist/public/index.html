<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#244c64" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta
      name="description"
      content="Локальная демонстрация картотеки клиентов на вымышленных данных."
    />
    <title>Картотека · кабинет</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23244c64'/%3E%3Cpath d='M9 9h14v14H9zM12 13h8M12 17h8' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="ui-extra.css" />
    <link rel="stylesheet" href="auth.css" />
    <link rel="stylesheet" href="install-app.css" />
    <script src="install-app.js" defer></script>
    <script src="security.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body class="app-loading">
    <p id="load-status" role="status">Загружаем картотеку…</p>
    <header class="topbar">
      <nav class="app-nav" aria-label="Разделы картотеки">
        <button class="app-nav-item active" data-view="calendar">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect x="3" y="4" width="18" height="17" rx="3" />
            <path d="M7 2v4m10-4v4M3 9h18M7 13h2m3 0h2m3 0h0M7 17h2m3 0h2" /></svg
          ><span class="nav-label">Календарь</span></button
        ><button class="app-nav-item" data-view="clients">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="9" cy="8" r="3" />
            <path d="M3 21v-2a6 6 0 0 1 12 0v2M17 5a3 3 0 0 1 0 6m1 4a5 5 0 0 1 3 4v2" /></svg
          ><span class="nav-label">Клиенты</span></button
        ><button class="app-nav-item" data-view="card">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect x="3" y="3" width="18" height="18" rx="3" />
            <circle cx="8" cy="9" r="2" />
            <path d="M5 16a3 3 0 0 1 6 0m3-9h4m-4 5h4m-4 5h4" /></svg
          ><span class="nav-label">Карточка</span></button
        ><button class="app-nav-item" data-view="services">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <g class="nav-services-glyph">
              <rect x="3" y="3" width="7" height="7" rx="1.5" />
              <rect x="14" y="3" width="7" height="7" rx="1.5" />
              <rect x="3" y="14" width="7" height="7" rx="1.5" />
              <rect x="14" y="14" width="7" height="7" rx="1.5" />
            </g>
            <g class="nav-management-glyph">
              <path d="M3 6h3m4 0h11M3 12h11m4 0h3M3 18h5m4 0h9" />
              <circle cx="8" cy="6" r="2" />
              <circle cx="16" cy="12" r="2" />
              <circle cx="10" cy="18" r="2" />
            </g></svg
          ><span class="nav-label">Управление</span
          ><span class="booking-inbox-count" data-booking-request-count hidden></span></button
        ><button class="app-nav-item" data-view="settings">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="m9 3 1-1h4l1 3 3 1 3 1v4l-2 2 1 3-2 3-3-1-2 3h-4l-1-3-3-1-2-2 1-4 2-1 1-3z" />
            <circle cx="12" cy="12" r="3" /></svg
          ><span class="nav-label">Настройки</span>
          <span
            class="booking-inbox-count booking-health-count"
            data-booking-health-count
            hidden
          ></span>
        </button>
      </nav>
      <a class="brand" href="#"
        ><span class="brand-icon">К</span
        ><span>Картотека<small>Личный кабинет специалиста</small></span></a
      >
    </header>
    <main class="workspace" id="workspace">
      <aside class="directory" aria-label="Клиенты">
        <div class="section-heading">
          <h1>Клиенты <span id="count"></span></h1>
          <button class="add-round" id="add-patient" aria-label="Добавить клиента">+</button>
        </div>
        <div class="directory-controls">
          <label class="search"
            ><span aria-hidden="true">⌕</span
            ><input
              id="search"
              type="search"
              placeholder="ФИО, телефон, обозначение"
              aria-label="Поиск клиента"
              autocomplete="off"
          /></label>
          <div class="client-filters" id="client-filters" aria-label="Фильтры клиентов">
            <button
              class="client-filter active"
              type="button"
              data-client-filter="all"
              aria-pressed="true"
            >
              Все <span id="filter-count-all"></span></button
            ><button
              class="client-filter"
              type="button"
              data-client-filter="appointment"
              aria-pressed="false"
            >
              Есть запись <span id="filter-count-appointment"></span></button
            ><button
              class="client-filter"
              type="button"
              data-client-filter="recent"
              aria-pressed="false"
              title="Посещение за последние 30 дней"
            >
              Были недавно <span id="filter-count-recent"></span></button
            ><button
              class="client-filter"
              type="button"
              data-client-filter="inactive"
              aria-pressed="false"
              title="Не были более 90 дней или ещё не посещали"
            >
              Давно не были <span id="filter-count-inactive"></span>
            </button>
          </div>
        </div>
        <div class="list-tools">
          <div class="list-summary">
            <span class="list-caption">АЛФАВИТНЫЙ СПИСОК</span><span id="list-result-count"></span>
          </div>
          <div class="name-sort" aria-label="Порядок клиентов">
            <span>Показывать сначала</span>
            <div class="sort-switch">
              <button class="active" type="button" data-patient-sort="first" aria-pressed="true">
                Имя</button
              ><button type="button" data-patient-sort="last" aria-pressed="false">Фамилию</button>
            </div>
          </div>
        </div>
        <div id="patient-list"></div>
        <p class="directory-note">Поиск клиентов и переход к их карточкам.</p>
      </aside>
      <section id="detail" class="detail" aria-label="Карточка клиента">
        <div class="welcome">
          <h2>Откройте карточку клиента</h2>
          <p>Выберите имя в списке слева.</p>
        </div>
      </section>
      <section id="global-view" class="global-view" hidden aria-live="polite"></section>
    </main>
    <dialog id="editor">
      <form id="editor-form">
        <div class="dialog-heading">
          <h2 id="dialog-title"></h2>
          <button type="button" class="icon-btn" id="close-editor" aria-label="Закрыть форму">
            ×
          </button>
        </div>
        <div id="form-content"></div>
        <p id="form-error" class="error" role="alert"></p>
        <div class="dialog-actions">
          <button type="button" class="secondary" id="cancel-editor">Отмена</button
          ><button type="submit" class="primary" id="save-editor">Сохранить</button>
        </div>
      </form>
    </dialog>
    <dialog id="photo-view" aria-labelledby="photo-view-title">
      <div class="dialog-heading">
        <h2 id="photo-view-title">Просмотр фотографии</h2>
        <button type="button" class="icon-btn" id="close-photo" aria-label="Закрыть фотографию">
          ×
        </button>
      </div>
      <img id="large-photo" alt="" />
      <p id="photo-caption"></p>
    </dialog>
    <section id="patient-print" aria-hidden="true"></section>
    <div id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
